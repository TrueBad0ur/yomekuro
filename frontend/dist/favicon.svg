    <!-- spine shadow -->
    <path d="M15.3 13.8v12.6h1.4V13.8z" fill="#2a3450" opacity="0.5"/>
    <!-- page lines left -->
    <line x1="9.5" y1="15.3" x2="14.3" y2="15.9" stroke="#2a3450" stroke-width="0.8" opacity="0.6"/>
    <line x1="9.5" y1="18.1" x2="14.3" y2="18.7" stroke="#2a3450" stroke-width="0.8" opacity="0.6"/>
    <line x1="9.5" y1="20.9" x2="14.3" y2="21.5" stroke="#2a3450" stroke-width="0.8" opacity="0.6"/>
    <!-- page lines right -->
    <line x1="22.5" y1="15.3" x2="17.7" y2="15.9" stroke="#2a3450" stroke-width="0.8" opacity="0.5"/>
    <line x1="22.5" y1="18.1" x2="17.7" y2="18.7" stroke="#2a3450" stroke-width="0.8" opacity="0.5"/>
  </g>
</svg>
