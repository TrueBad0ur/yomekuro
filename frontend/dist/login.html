<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yomekuro — Login</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    (function() {
      document.documentElement.setAttribute(
        'data-theme', localStorage.getItem('theme') || 'dark'
      );
    })();
  </script>
</head>
<body class="page-login">
  <div class="login-wrap">
    <div class="login-logo">よめくろ</div>

    <a class="google-login-btn" id="google-login-btn" href="/api/auth/google" hidden>
      <svg class="google-login-icon" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.482h4.844a4.14 4.14 0 0 1-1.797 2.714v2.258h2.909c1.702-1.567 2.684-3.875 2.684-6.613z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.468-.806 5.956-2.182l-2.909-2.258c-.806.54-1.835.859-3.047.859-2.344 0-4.328-1.585-5.037-3.714H.956v2.332A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.963 10.705A5.42 5.42 0 0 1 3.682 9c0-.592.102-1.168.281-1.705V4.963H.956A9 9 0 0 0 0 9c0 1.452.347 2.827.956 4.037l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.322 0 2.508.454 3.441 1.346l2.581-2.581C13.464.892 11.426 0 9 0A9 9 0 0 0 .956 4.963l3.007 2.332C4.672 5.165 6.656 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </a>
    <div class="login-divider" id="login-divider" hidden><span>or</span></div>

    <div class="login-tabs">
      <button class="login-tab active" id="tab-login">Login</button>
      <button class="login-tab" id="tab-register">Register</button>
    </div>

    <form class="login-form" id="login-form" autocomplete="on">
      <div class="login-field">
        <label for="login-username">Username</label>
        <input id="login-username" type="text" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" required>
      </div>
      <p class="login-error" id="login-error" hidden></p>
      <button type="submit" class="login-submit">Login</button>
    </form>

    <form class="login-form" id="register-form" hidden autocomplete="on">
      <div class="login-field">
        <label for="reg-username">Username</label>
        <input id="reg-username" type="text" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label for="reg-password">Password</label>
        <input id="reg-password" type="password" autocomplete="new-password" required>
      </div>
      <p class="login-error" id="reg-error" hidden></p>
      <button type="submit" class="login-submit">Create account</button>
    </form>
  </div>

  <script src="/login.js"></script>
</body>
</html>
